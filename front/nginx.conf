events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ~* \.(?:js|css|map|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
