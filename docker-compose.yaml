services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waitlist
      POSTGRES_USER: waitlist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waitlist}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waitlist -d waitlist"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "8000"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      DATABASE_URL: postgresql://waitlist:${POSTGRES_PASSWORD:-waitlist}@postgres:5432/waitlist
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    depends_on:
      - app
    ports:
      - "127.0.0.1:4200:80"

volumes:
  postgres_data:
